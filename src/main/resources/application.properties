# Database: the Postgres container from .devcontainer/docker-compose.yml.
# Values come from the environment, with defaults matching the dev container.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRES_HOSTNAME:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:climbtracker}
quarkus.datasource.username=${POSTGRES_USER:postgres}
quarkus.datasource.password=${POSTGRES_PASSWORD:postgres}

# The database already runs as its own container, so don't let Quarkus start another one.
quarkus.datasource.devservices.enabled=false

# Hibernate: rebuild the schema from the entities on every start (dev/test only).
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%dev.quarkus.hibernate-orm.log.sql=true
