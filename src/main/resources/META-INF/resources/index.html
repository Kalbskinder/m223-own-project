<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClimbTracker</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <span class="brand">ClimbTracker</span>
    <nav id="nav" hidden>
      <button class="tab" data-view="routes">Routen</button>
      <button class="tab" data-view="gyms">Hallen</button>
      <button class="tab" data-view="climbs">Meine Climbs</button>
    </nav>
    <div id="user-box" class="user-box" hidden>
      <span id="user-name"></span>
      <button id="logout" class="link">Abmelden</button>
    </div>
  </header>

  <main>
    <p id="message" class="message" role="status" hidden></p>

    <!-- Login / Registrierung -->
    <section id="view-login" class="view narrow">
      <h1 id="auth-title">Anmelden</h1>
      <form id="auth-form" class="card">
        <label>Benutzername
          <input name="username" required autocomplete="username">
        </label>
        <label>Passwort
          <input name="password" type="password" required autocomplete="current-password">
        </label>
        <button type="submit" id="auth-submit">Anmelden</button>
      </form>
      <p class="muted">
        <span id="auth-switch-text">Noch kein Konto?</span>
        <button id="auth-switch" class="link" type="button">Registrieren</button>
      </p>
    </section>

    <!-- Routen: Übersicht mit Filter -->
    <section id="view-routes" class="view" hidden>
      <div class="section-head">
        <h1>Routen</h1>
        <button id="route-new" type="button">Neue Route</button>
      </div>

      <form id="route-form" class="card" hidden>
        <h2 id="route-form-title">Neue Route</h2>
        <input type="hidden" name="editId">
        <div class="fields">
          <label>Halle <select name="gymId" required></select></label>
          <label>Grad <input name="grade" required placeholder="z. B. 6a+"></label>
          <label>Griff-Farbe <input name="color" type="color" value="#d32f2f"></label>
          <label class="check"><input name="active" type="checkbox" checked> Aktiv (hängt noch)</label>
        </div>
        <div class="actions">
          <button type="submit">Speichern</button>
          <button type="button" class="secondary" data-cancel>Abbrechen</button>
        </div>
      </form>

      <div class="filters">
        <label>Halle
          <select id="filter-gym"><option value="">Alle Hallen</option></select>
        </label>
        <label>Grad
          <input id="filter-grade" placeholder="z. B. 6a">
        </label>
        <label class="check"><input id="filter-active" type="checkbox"> Nur aktive</label>
        <label class="check"><input id="filter-mine" type="checkbox"> Nur meine</label>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Farbe</th><th>Grad</th><th>Halle</th><th>Status</th><th></th></tr>
          </thead>
          <tbody id="route-list"></tbody>
        </table>
      </div>
      <p id="route-empty" class="muted" hidden>Keine Routen gefunden.</p>
    </section>

    <!-- Hallen -->
    <section id="view-gyms" class="view" hidden>
      <div class="section-head">
        <h1>Hallen</h1>
        <button id="gym-new" type="button">Neue Halle</button>
      </div>

      <form id="gym-form" class="card" hidden>
        <h2>Neue Halle</h2>
        <div class="fields">
          <label>Name <input name="name" required></label>
          <label>Ort / Adresse <input name="address" required></label>
          <label>Website <input name="website" type="url" required placeholder="https://"></label>
        </div>
        <div class="actions">
          <button type="submit">Speichern</button>
          <button type="button" class="secondary" data-cancel>Abbrechen</button>
        </div>
      </form>

      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Name</th><th>Ort</th><th>Website</th><th>Routen</th><th></th></tr>
          </thead>
          <tbody id="gym-list"></tbody>
        </table>
      </div>
      <p id="gym-empty" class="muted" hidden>Noch keine Hallen erfasst.</p>
    </section>

    <!-- Eigene Climbs -->
    <section id="view-climbs" class="view" hidden>
      <div class="section-head">
        <h1>Meine Climbs</h1>
        <button id="climb-new" type="button">Climb eintragen</button>
      </div>

      <form id="climb-form" class="card" hidden>
        <h2>Climb eintragen</h2>
        <div class="fields">
          <label>Route <select name="routeId" required></select></label>
          <label>Ergebnis <select name="result" required></select></label>
          <label>Versuche <input name="attempts" type="number" min="1" value="1" required></label>
          <label>Bewertung (1–5) <input name="rating" type="number" min="1" max="5" value="3" required></label>
          <label class="wide">Notiz <input name="note" placeholder="optional"></label>
        </div>
        <div class="actions">
          <button type="submit">Speichern</button>
          <button type="button" class="secondary" data-cancel>Abbrechen</button>
        </div>
      </form>

      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Route</th><th>Halle</th><th>Ergebnis</th><th>Versuche</th><th>Bewertung</th><th>Notiz</th><th></th></tr>
          </thead>
          <tbody id="climb-list"></tbody>
        </table>
      </div>
      <p id="climb-empty" class="muted" hidden>Du hast noch keine Climbs eingetragen.</p>
    </section>
  </main>
</body>
</html>
