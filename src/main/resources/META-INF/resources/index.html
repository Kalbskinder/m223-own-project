<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bank</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <span class="brand">Bank</span>
    <div id="user-box" class="user-box" hidden>
      <span id="user-name"></span>
      <button id="logout" class="link">Abmelden</button>
    </div>
  </header>

  <main>
    <p id="message" class="message" role="status" hidden></p>

    <!-- Login / Registrierung -->
    <section id="view-login" class="view narrow">
      <h1 id="auth-title">Anmelden</h1>
      <form id="auth-form" class="card">
        <label>Benutzername
          <input name="username" required autocomplete="username">
        </label>
        <label>Passwort
          <input name="password" type="password" required autocomplete="current-password">
        </label>
        <button type="submit" id="auth-submit">Anmelden</button>
      </form>
      <p class="muted">
        <span id="auth-switch-text">Noch kein Konto?</span>
        <button id="auth-switch" class="link" type="button">Registrieren</button>
      </p>
      <p id="auth-bonus" class="muted" hidden>Neue Konten starten mit einem Guthaben von CHF 1'000.00.</p>
    </section>

    <!-- Konto -->
    <section id="view-account" class="view" hidden>
      <div class="card balance-card">
        <span class="muted">Kontostand</span>
        <strong id="balance" class="balance">–</strong>
        <span id="account-meta" class="muted small"></span>
      </div>

      <div class="grid-2">
        <form id="withdraw-form" class="card">
          <h2>Geld abheben</h2>
          <label>Betrag (CHF)
            <input name="amount" type="number" min="0.05" step="0.05" required inputmode="decimal" placeholder="0.00">
          </label>
          <div class="quick">
            <button type="button" class="small secondary" data-quick="20">20</button>
            <button type="button" class="small secondary" data-quick="50">50</button>
            <button type="button" class="small secondary" data-quick="100">100</button>
            <button type="button" class="small secondary" data-quick="200">200</button>
          </div>
          <div class="actions">
            <button type="submit">Abheben</button>
          </div>
        </form>

        <form id="transfer-form" class="card">
          <h2>Geld überweisen</h2>
          <label>Empfänger (Benutzername)
            <input name="toUsername" required autocomplete="off">
          </label>
          <label>Betrag (CHF)
            <input name="amount" type="number" min="0.05" step="0.05" required inputmode="decimal" placeholder="0.00">
          </label>
          <div class="actions">
            <button type="submit">Überweisen</button>
          </div>
        </form>
      </div>

      <h2>Letzte Buchungen</h2>
      <p class="muted small">Zeigt die Buchungen dieser Sitzung. Der Server speichert noch keinen Verlauf.</p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Zeit</th><th>Art</th><th>Details</th><th class="right">Betrag</th><th class="right">Saldo</th></tr>
          </thead>
          <tbody id="history"></tbody>
        </table>
      </div>
      <p id="history-empty" class="muted">Noch keine Buchungen.</p>
    </section>
  </main>
</body>
</html>
